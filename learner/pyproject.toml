[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "project-learner"
version = "0.1.0"
description = "Standalone two-mode directed learning foundation"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
project-learner = "learner.cli:main"

[tool.setuptools]
packages = ["learner"]

[tool.setuptools.package-dir]
learner = "."
