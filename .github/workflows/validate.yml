name: Validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python scripts/verify_repository.py
      - run: bash -n install.sh gate/selftest.sh gate/watch-journal.sh
      - run: python -m py_compile gate/gate.py flow/flow.py flow/audit.py
  gate-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: bash gate/selftest.sh "$RUNNER_TEMP/gate-selftest"
      - run: python -m unittest discover -s gate -p "test_*.py" -q
      - run: python -m unittest discover -s scripts -p "test_debate_quota.py" -q
